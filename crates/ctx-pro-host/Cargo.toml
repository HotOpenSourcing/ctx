[package]
name = "ctx-pro-host"
version = "0.26.0"
description = "Low-level installed-helper runtime for ctx Pro"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
qualification = ["ctx-pro-access/qualification"]
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-index = { path = "../ctx-history-index" }
ctx-history-refresh = { path = "../ctx-history-refresh" }
ctx-pro-access = { path = "../ctx-pro-access" }
ctx-pro-host-protocol = { path = "../ctx-pro-host-protocol" }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile.workspace = true
