[package]
name = "ctx-history-capture"
version = "0.26.0"
description = "Internal provider import adapters for ctx local agent history"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64.workspace = true
chrono.workspace = true
directories.workspace = true
json5.workspace = true
jsonc-parser.workspace = true
libc.workspace = true
quick-xml.workspace = true
regex.workspace = true
rmpv.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml_edit.workspace = true
url.workspace = true
uuid.workspace = true
zstd.workspace = true
ctx-history-capture-model = { path = "../ctx-history-capture-model" }
ctx-history-core = { path = "../ctx-history-core" }
ctx-history-index = { path = "../ctx-history-index" }
ctx-history-jsonl = { path = "../ctx-history-jsonl" }
ctx-history-repository-evidence = { path = "../ctx-history-repository-evidence" }
ctx-history-source-io = { path = "../ctx-history-source-io" }
ctx-history-source-discovery = { path = "../ctx-history-source-discovery" }
ctx-pro-host-protocol = { path = "../ctx-pro-host-protocol" }

[dev-dependencies]
ctx-history-source-io = { path = "../ctx-history-source-io", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
] }
